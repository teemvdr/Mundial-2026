<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mundial Grupos</title>

<style>
body { 
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    text-align: center; 
    margin: 0;
    padding: 20px;
    /* Fondo inspirado en el sobre Panini 2026 */
    background-color: #f4f4f4;
    background-image: 
        radial-gradient(circle at 100% 150%, #5cb85c 24%, #428bca 25%, #428bca 28%, #d9534f 29%, #d9534f 36%, #5bc0de 36%, #5bc0de 40%, transparent 40%),
        radial-gradient(circle at 0% 150%, #f0ad4e 24%, #5bc0de 25%, #5bc0de 28%, #5cb85c 29%, #5cb85c 36%, #d9534f 36%, #d9534f 40%, transparent 40%),
        linear-gradient(to bottom, #003366, #001a33);
    background-attachment: fixed;
    background-size: 100% 100%, 100% 100%, cover;
}

body::before {
    content: "";
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background-image: url("https://www.transparenttextures.com/patterns/cubes.png");
    opacity: 0.1; /* Esto le da la textura de papel de figurita */
    z-index: -1;
    pointer-events: none;
}

h1 {
    color: #ffcc00;
    background: rgba(0, 51, 102, 0.8);
    padding: 20px;
    border-top: 5px solid #00dfa2;
    border-bottom: 5px solid #00dfa2;
    display: block;
    margin-top: 0;
    text-shadow: 2px 2px 0px #000;
}

/* Tarjetas de Grupos */
.grupo {
    background: white;
    border: 1px solid #ccc;
    border-radius: 0; /* Figuritas son cuadradas */
    box-shadow: 5px 5px 15px rgba(0,0,0,0.3);
    margin: 30px auto;
    padding: 0; /* Para que el cabezal pegue al borde */
    max-width: 500px;
    overflow: hidden;
    border-top: 10px solid #00dfa2; /* Color verde del simulador */
}

.grupo:hover {
    transform: translateY(-5px);
}

.grupo h2 {
    background-color: #00dfa2; /* El verde neón de tu imagen */
    color: #003366;
    margin: 0;
    padding: 15px;
    font-size: 24px;
    text-transform: uppercase;
}

/* Tablas */
table {
    width: 100%;
    margin-top: 15px;
    border-collapse: collapse;
    background: #fff;
}

th {
    background-color: #003366;
    color: white;
    padding: 10px;
}

td {
    border-bottom: 1px solid #ddd;
    padding: 8px;
}

/* Eliminatorias */
#eliminatorias h2 {
    text-align: center;
    background: #00dfa2;
    color: #003366;
    padding: 10px;
    border-radius: 5px;
    margin: 40px auto 20px auto;
    max-width: 600px;
}

.partido {
    display: flex;
    justify-content: center; /* Centra todo el contenido del partido */
    align-items: center;
    gap: 10px;
    margin: 15px auto;
    background: white;
    padding: 12px;
    border-radius: 8px;
    max-width: 600px; /* Limita el ancho para que no se estire de más */
}

.partido-fila {
    display: grid;
    grid-template-columns: 1fr auto 1fr; /* Izquierda - Medio - Derecha */
    align-items: center;
    gap: 10px;
    padding: 12px;
    border-bottom: 1px solid #eee;
}

.equipo-izq {
    text-align: right;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 10px;
    font-weight: bold;
}

.equipo-der {
    text-align: left;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 10px;
    font-weight: bold;
}

.inputs-goles {
    display: flex;
    align-items: center;
    gap: 5px;
}

input[type="number"] {
    width: 45px;
    height: 35px;
    border: 2px solid #0056b3;
    border-radius: 8px;
    text-align: center;
    font-size: 18px;
    font-weight: bold;
}

.partido input {
    width: 50px !important; /* El !important asegura que gane a otras reglas */
    text-align: center;
}

.equipo:first-child {
    justify-content: flex-end;
    text-align: right;
}

.equipo:last-of-type {
    justify-content: flex-start;
    text-align: left;
}

.grupo {
    border: 2px solid #000;
    background: white;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    margin: 20px auto; /* Centra el cuadro */
    padding: 15px;
    max-width: 500px;
    display: block; /* Asegura que respete el auto margin */
}

.equipo {
    flex: 1; /* Hace que ambos lados ocupen el mismo espacio */
    font-weight: bold;
    display: flex;
    align-items: center;
    gap: 8px;
}

/* Inputs y Botones */
input {
    width: 45px;
    height: 35px;
    border: 2px solid #0056b3;
    border-radius: 8px;
    margin: 0 10px;
    font-size: 18px;
    font-weight: bold;
    text-align: center;
}

button {
    background-color: #00dfa2;
    color: #003366;
    border: none;
    padding: 10px 25px;
    font-weight: bold;
    text-transform: uppercase;
    cursor: pointer;
    margin: 10px;
    transition: 0.3s;
}

button:hover {
    background-color: #003366;
    color: white;
}

.equipo img {
    border: 1px solid #eee;
    border-radius: 3px;
}

@keyframes victoria-brillo {
    0% { transform: scale(1); filter: brightness(1); }
    50% { transform: scale(1.1); filter: brightness(1.5); color: #ffcc00; }
    100% { transform: scale(1); filter: brightness(1); }
}

.animar-ganador-single {
    animation: victoria-brillo 0.6s ease-in-out;
    display: inline-block; /* Para que la transformación se note mejor */
}

#gran-campeon {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0, 51, 102, 0.95);
    color: white;
    padding: 40px;
    border-radius: 20px;
    border: 5px solid #00dfa2;
    z-index: 1000;
    text-align: center;
    box-shadow: 0 0 50px rgba(0,0,0,0.5);
}

#gran-campeon h1 {
    font-size: 50px;
    margin: 10px 0;
    color: #ffcc00;
}

.overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.7);
    z-index: 999;
}

.logo-mundial {
    position: absolute;
    top: 5px; /* Un poco más arriba */
    right: 30px; /* Un poco más a la izquierda */
    z-index: 1000;
}

.logo-mundial {
    position: absolute;
    top: 60px; /* Cambié 5px por 60px para que baje bastante */
    right: 30px; 
    z-index: 1000;
}
.logo-mundial img {
    width: 100px; 
    height: auto;
    filter: drop-shadow(0 0 10px rgba(0, 0, 0, 0.5));
}

@media (max-width: 600px) {
    .logo-mundial img {
        width: 80px; /* Se achica en el celu */
    }
}

</style>
</head>

<body>

<div class="logo-mundial">
    <img src="logo.png" alt="FIFA World Cup 2026">
</div>

<h1>Simulador de Grupos Mundial</h1>

<div id="app"></div>

<br>

<button onclick="generarEliminatorias()">Generar Eliminatorias</button>

<div id="eliminatorias"></div>

<div id="overlay" class="overlay"></div>
<div id="gran-campeon">
    <p>🏆 ¡TENEMOS UN CAMPEÓN! 🏆</p>
    <h1 id="nombre-campeon"></h1>
    <button onclick="cerrarCampeon()">Cerrar</button>
</div>

<script>

function crearGrupo(nombre, equipos) {
  return { nombre, equipos: equipos.map(e => ({ nombre: e, pts: 0, dg: 0 })) };
}

let grupos = [
  crearGrupo("Grupo A", ["México","Sudáfrica","Corea del Sur","Chequia"]),
  crearGrupo("Grupo B", ["Canadá","Bosnia y Herzegovina","Catar","Suiza"]),
  crearGrupo("Grupo C", ["Brasil","Marruecos","Haití","Escocia"]),
  crearGrupo("Grupo D", ["Estados Unidos","Paraguay","Australia","Turquía"]),
  crearGrupo("Grupo E", ["Alemania","Curazao","Costa de Marfil","Ecuador"]),
  crearGrupo("Grupo F", ["Países Bajos","Japon","Suecia","Túnez"]),
  crearGrupo("Grupo G", ["Bélgica","Egipto","Irán","Nueva Zelanda"]),
  crearGrupo("Grupo H", ["España","Cabo Verde","Arabia Saudita","Uruguay"]),
  crearGrupo("Grupo I", ["Francia","Senegal","Irak","Noruega"]),
  crearGrupo("Grupo J", ["Argentina","Argelia","Austria","Jordania"]),
  crearGrupo("Grupo K", ["Portugal","RD Congo","Uzbequistán","Colombia"]),
  crearGrupo("Grupo L", ["Inglaterra","Croacia","Ghana","Panamá"])
];

let data = localStorage.getItem("mundialData");
if (data) grupos = JSON.parse(data);

// --- GENERAR INTERFAZ DE GRUPOS ---
let app = document.getElementById("app");
grupos.forEach((grupo, index) => {
  let div = document.createElement("div");
  div.className = "grupo";
  div.innerHTML = `
    <h2 onclick="toggle(${index})">${grupo.nombre}</h2>
    <div class="contenido" id="contenido-${index}">
      ${crearPartidosHTML(index)}
      <br><button onclick="calcular(${index})">Calcular tabla</button><br><br>
      <table>
        <thead><tr><th>Equipo</th><th>Pts</th><th>DG</th></tr></thead>
        <tbody id="tabla-${index}"></tbody>
      </table>
    </div>`;
  app.appendChild(div);
});

function crearPartidosHTML(i) {
  let g = grupos[i].equipos;
  
  // Esta función 'm' ahora genera la estructura de "Figurita" Panini
  const m = (id, e1, e2) => `
    <div class="partido-fila">
      <div class="equipo-izq">
        <span>${e1.nombre}</span> ${escudo(e1.nombre)}
      </div>
      
      <div class="inputs-goles">
        <input id="g${i}-${id}a" type="number" min="0">
        <span>-</span>
        <input id="g${i}-${id}b" type="number" min="0">
      </div>

      <div class="equipo-der">
        ${escudo(e2.nombre)} <span>${e2.nombre}</span>
      </div>
    </div>`;

  return m(1,g[0],g[1]) + m(2,g[0],g[2]) + m(3,g[0],g[3]) + 
         m(4,g[1],g[2]) + m(5,g[1],g[3]) + m(6,g[2],g[3]);
}

function toggle(i) {
  document.querySelectorAll(".contenido").forEach(el => el.style.display = "none");
  document.getElementById("contenido-" + i).style.display = "block";
}

function calcular(i) {
  let g = grupos[i];
  g.equipos.forEach(e => { e.pts = 0; e.dg = 0; });
  
  for(let p=1; p<=6; p++) {
    let g1 = val(`g${i}-${p}a`), g2 = val(`g${i}-${p}b`);
    if (g1 === null || g2 === null) return alert("Completá todos los partidos");
    let indices = [[0,1],[0,2],[0,3],[1,2],[1,3],[2,3]][p-1];
    let e1 = g.equipos[indices[0]], e2 = g.equipos[indices[1]];
    e1.dg += (g1-g2); e2.dg += (g2-g1);
    if(g1>g2) e1.pts+=3; else if(g2>g1) e2.pts+=3; else { e1.pts++; e2.pts++; }
  }
  g.equipos.sort((a,b) => b.pts - a.pts || b.dg - a.dg);
  mostrar(i);
  localStorage.setItem("mundialData", JSON.stringify(grupos));
}

function mostrar(i) {
  let html = "";
  grupos[i].equipos.forEach((e, idx) => {
    let color = idx < 2 ? "lightgreen" : (idx === 2 ? "lightblue" : "");
    html += `<tr style="background:${color}"><td>${e.nombre}</td><td>${e.pts}</td><td>${e.dg}</td></tr>`;
  });
  document.getElementById(`tabla-${i}`).innerHTML = html;
}

function val(id) {
  let v = document.getElementById(id).value;
  return v === "" ? null : parseInt(v);
}

function escudo(n) {
  const c = {"Argentina":"ar","México":"mx","Brasil":"br","Arabia Saudita":"sa","Sudáfrica":"za","Corea del Sur":"kr","Chequia":"cz","Canadá":"ca","Bosnia y Herzegovina":"ba","Catar":"qa","Suiza":"ch","Marruecos":"ma","Haití":"ht","Estados Unidos":"us","Australia":"au","Paraguay":"py","Turquía":"tr","Alemania":"de","Curazao":"cw","Costa de Marfil":"ci","Ecuador":"ec","Países Bajos":"nl","Japon":"jp","Suecia":"se","Túnez":"tn","Bélgica":"be","Egipto":"eg","Irán":"ir","Nueva Zelanda":"nz","España":"es","Cabo Verde":"cv","Uruguay":"uy","Francia":"fr","Senegal":"sn","Irak":"iq","Noruega":"no","Argelia":"dz","Austria":"at","Jordania":"jo","Portugal":"pt","RD Congo":"cd","Uzbequistán":"uz","Colombia":"co","Croacia":"hr","Ghana":"gh","Panamá":"pa"};
  if(n==="Escocia") return `<img src="https://upload.wikimedia.org/wikipedia/commons/1/10/Flag_of_Scotland.svg" width="20">`;
  if(n==="Inglaterra") return `<img src="https://flagcdn.com/w40/gb-eng.png" width="20">`;
  return c[n] ? `<img src="https://flagcdn.com/w40/${c[n]}.png" width="20">` : "🏳️";
}

// --- LÓGICA DE ELIMINATORIAS (CORREGIDA) ---
function obtenerClasificados() {
  let clasificados = [];
  let terceros = [];
  grupos.forEach(g => {
    let ordenados = [...g.equipos].sort((a,b) => b.pts - a.pts || b.dg - a.dg);
    clasificados.push(ordenados[0], ordenados[1]);
    terceros.push(ordenados[2]);
  });
  terceros.sort((a,b) => b.pts - a.pts || b.dg - a.dg);
  return [...clasificados, ...terceros.slice(0, 8)];
}

function generarEliminatorias() {
  let equipos = obtenerClasificados();
  // Limpiamos todo antes de empezar
  document.getElementById("eliminatorias").innerHTML = `
    <div id="r16"><h2>16vos</h2></div>
    <div id="r8"><h2>8vos</h2></div>
    <div id="r4"><h2>4tos</h2></div>
    <div id="r2"><h2>Semis</h2></div>
    <div id="r1"><h2>Final</h2></div>`;

  let contenedor16 = document.getElementById("r16");
  for (let i = 0; i < equipos.length; i += 2) {
    contenedor16.insertAdjacentHTML('beforeend', crearPartidoUI("r16", i/2, equipos[i], equipos[i+1]));
  }
}

function crearPartidoUI(ronda, indice, e1, e2) {
  return `
    <div class="partido" id="${ronda}-p${indice}">
      ${equipoFila(e1, ronda, indice, "a")} - ${equipoFila(e2, ronda, indice, "b")}
      <button onclick="procesarGanador('${ronda}', ${indice})">✔</button>
    </div>`;
}

function equipoFila(e, ronda, indice, lado) {
  let nombre = e ? e.nombre : "---";
  // min="0" para evitar negativos
  return `
    <span class="equipo" data-nombre="${nombre}">
      ${nombre !== "---" ? escudo(nombre) : ""} ${nombre}
      <input id="${ronda}-p${indice}${lado}" type="number" min="0">
    </span>`;
}

function procesarGanador(ronda, indice) {
  let g1 = val(`${ronda}-p${indice}a`), g2 = val(`${ronda}-p${indice}b`);
  
  if (g1 === null || g2 === null) return alert("Poné los goles");
  if (g1 === g2) return alert("En eliminatorias no puede haber empate. ¡Jugá penales!");

  let div = document.getElementById(`${ronda}-p${indice}`);
  let nombres = div.querySelectorAll(".equipo"); // Seleccionamos los dos bloques de equipo
  
  // Identificamos quién ganó
  let indiceGanador = g1 > g2 ? 0 : 1;
  let ganador = nombres[indiceGanador].dataset.nombre;

  // ANIMACIÓN SOLO PARA EL GANADOR:
  // Aplicamos la animación solo al span/div del equipo que ganó
  nombres[indiceGanador].classList.add('animar-ganador-single');
  setTimeout(() => {
      nombres[indiceGanador].classList.remove('animar-ganador-single');
  }, 600);

  const sig = {"r16":"r8", "r8":"r4", "r4":"r2", "r2":"r1"};
  let proxima = sig[ronda];

  // Lógica para el Gran Campeón
  if (!proxima) {
    document.getElementById("nombre-campeon").innerText = ganador.toUpperCase();
    document.getElementById("gran-campeon").style.display = "block";
    document.getElementById("overlay").style.display = "block";
    return;
  }

  // Avanzar al siguiente partido (tu lógica actual se mantiene igual abajo)
  let proxIndice = Math.floor(indice / 2);
  let lado = (indice % 2 === 0) ? "a" : "b";
  let idProx = `${proxima}-p${proxIndice}`;
  
  if (!document.getElementById(idProx)) {
    document.getElementById(proxima).insertAdjacentHTML('beforeend', `
      <div class="partido" id="${idProx}">
        <span id="${idProx}a_cont"></span> - <span id="${idProx}b_cont"></span>
      </div>`);
  }

  document.getElementById(`${idProx}${lado}_cont`).innerHTML = equipoFila({nombre: ganador}, proxima, proxIndice, lado);
  
  let pSig = document.getElementById(idProx);
  let inputs = pSig.querySelectorAll("input");
  if (inputs.length === 2 && !pSig.querySelector("button")) {
    let btn = document.createElement("button");
    btn.innerText = "✔";
    btn.onclick = () => procesarGanador(proxima, proxIndice);
    pSig.appendChild(btn);
  }
}

// Función nueva para cerrar el cartel
function cerrarCampeon() {
    document.getElementById("gran-campeon").style.display = "none";
    document.getElementById("overlay").style.display = "none";
}
</script>
</body>
</html>
